# Builds NeoAmp for each platform when a GitHub release is published, and attaches the Linux
# archive, the Linux Flatpak bundle (flatpak.yml), the macOS disk images (macos.yml) and the
# Windows installer and zip (windows.yml) to that release.
#
# To make a release:
#   1. Set `version` in Cargo.toml (say 0.2.0), add a <release> line for it at the top of
#      <releases> in resources/io.github.BlakeGardner.NeoAmp.metainfo.xml, with the date, and
#      commit and push both.
#   2. Publish a release on GitHub whose tag is that version with a leading "v" (v0.2.0),
#      from the web page or with `gh release create v0.2.0 --generate-notes`.
#
# NeoAmp's check for a new release (src/update.rs) reads that tag, and tells of the release
# once this workflow has attached a package for the system and processor NeoAmp runs on:
# keep the tags, and the packages' names as neoamp-<tag>-<system>-<processor> then "." or
# "-" (64-bit ARM is arm64 or aarch64). See "Release packages" in docs/DEVELOPMENT.md.
#
# The macOS builds are signed and notarized with secrets set once on the repository: see
# "Signing and notarizing" in docs/DEVELOPMENT.md.
#
# The builds are attached only once every platform has built, so a release never ends up
# with some of them missing. A failed run can be re-run from the Actions tab; the archives
# replace any already attached.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Rust that releases are built with: the same as in ci.yml, so a release is built by the
  # compiler its code was checked with. Move it up together with ci.yml's, macos.yml's and
  # windows.yml's.
  RUST_VERSION: "1.95"
  # Passed through the environment rather than written into the scripts, so the tag's text
  # can never be run as part of a command.
  TAG: ${{ github.event.release.tag_name }}

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The tag must be Cargo.toml's version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag is $TAG, but Cargo.toml's version is $version: tag the release v$version, or change the version first."
            exit 1
          fi
      - name: The Flatpak's metainfo must list the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if ! grep -q "<release version=\"$version\"" resources/io.github.BlakeGardner.NeoAmp.metainfo.xml; then
            echo "::error::resources/io.github.BlakeGardner.NeoAmp.metainfo.xml has no <release> for $version: add one at the top of <releases>."
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner, so the binary needs only that glibc (2.35) or newer.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
    env:
      ARCHIVE: neoamp-${{ github.event.release.tag_name }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the ALSA development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/neoamp" README.md "$ARCHIVE/"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}.*
          if-no-files-found: error
          # Already compressed.
          compression-level: 0

  flatpak:
    name: Flatpak
    needs: version
    uses: ./.github/workflows/flatpak.yml
    with:
      bundle: neoamp-${{ github.event.release.tag_name }}-linux-x86_64.flatpak

  macos:
    name: macOS
    needs: version
    uses: ./.github/workflows/macos.yml
    # For signing and notarizing the disk images: see macos.yml.
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  windows:
    name: Windows
    needs: version
    uses: ./.github/workflows/windows.yml

  attach:
    name: Attach to the release
    needs: [build, flatpak, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can change the release; the builds above, which run every crate's build
    # script, get a read-only token.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Named one by one: the run's other artifacts (the Flatpak's crate list, the macOS apps
      # before signing, the Windows installer's screenshots and logs) stay behind.
      - name: Upload the archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/*.flatpak dist/*.dmg dist/*.exe --clobber
