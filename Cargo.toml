[package]
name = "neoamp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A music player with a pixel-exact classic Winamp 2.x-style interface, skinnable with .wsz skins"

[lib]
# No doc examples yet; skipping doctests also keeps `cargo test` working on toolchains
# whose rustdoc is broken.
doctest = false

[dependencies]
winit = "0.30"
pixels = "0.17"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["bmp", "png", "ico"] }
fontdue = "0.9"
# The system's fonts by family name, for the font a skin's pledit.txt names. Pure Rust; on Linux
# it reads fontconfig's configuration files to find the font folders.
fontdb = "0.23"
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
# AAC and ALAC come in MP4 (M4A) files; mpa is MP1, MP2 and MP3.
symphonia = { version = "0.6", features = ["aac", "alac", "isomp4", "aiff", "mpa"] }
cpal = "0.18"
rtrb = "0.4"
rubato = "5"
realfft = "3"
# Native file dialogs: Windows' common dialog, macOS's NSOpenPanel, the XDG desktop portal on
# Linux (libdbus is loaded at runtime, so building needs no extra packages).
rfd = "0.17"
# Waits for the file dialog's future; already used by pixels.
pollster = "0.4"
# Saved settings (settings.toml) in the platform's config folder.
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6"
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
# HTTPS for internet radio (src/http.rs), the same on every platform. ring is its crypto: it
# compiles a little C and assembly with the platform's C compiler, but needs no system library.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Mozilla's root certificates, built in, so certificates are checked the same way everywhere.
webpki-roots = "1"
# The clipboard, for pasting into the dialogs' text boxes: native on Windows and macOS, X11
# (XWayland included) on Linux. Pure Rust.
arboard = { version = "3", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
