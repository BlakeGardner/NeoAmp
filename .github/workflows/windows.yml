# Builds NeoAmp for Windows with windows/package.ps1: the installer (Inno Setup, from
# windows/neoamp.iss) and a zip of the program. It then tries the installer: installs it
# silently, checks its file associations, starts NeoAmp, takes a screenshot of the desktop,
# opens three files together the way Explorer does, and uninstalls it again.
#
# It runs only for releases: release.yml calls it for every GitHub release and attaches the
# installer and the zip to the release with the other builds.

name: Windows

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Rust that releases are built with, as in ci.yml, release.yml and macos.yml: move the
  # four up together.
  RUST_VERSION: "1.95"

jobs:
  build:
    name: Build (windows-x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
      # Inno Setup 6 comes with GitHub's Windows image.
      - name: Build the installer and the zip
        run: windows/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: |
            target/windows/*-setup.exe
            target/windows/*.zip
          if-no-files-found: error
          # Already compressed.
          compression-level: 0

      - name: Try the installer
        run: |
          $setup = (Get-Item target/windows/*-setup.exe).FullName
          $app = Join-Path $env:LOCALAPPDATA 'Programs\NeoAmp'
          $exe = Join-Path $app 'neoamp.exe'
          $shots = (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'try') -Force).FullName
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{092209C5-E961-48D1-BC1C-68D0CCBB01DD}_is1'

          # Install for the current user, as most people will.
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/LOG=$shots\install.log" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "the installer failed with code $($p.ExitCode)" }
          foreach ($path in $exe, $uninstallKey, 'HKCU:\Software\Classes\NeoAmp.wsz\shell\open\command',
                   'HKCU:\Software\Classes\NeoAmp.mp3\shell\open\command', 'HKCU:\Software\Classes\.flac\OpenWithProgids',
                   'HKCU:\Software\NeoAmp\Capabilities\FileAssociations', 'HKCU:\Software\Classes\Directory\shell\NeoAmp.play\command',
                   'HKCU:\Software\Classes\SystemFileAssociations\.mp3\shell\NeoAmp.enqueue\command',
                   (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\NeoAmp.lnk')) {
            if (-not (Test-Path $path)) { throw "the installer did not make $path" }
          }
          Write-Output "Installed $((Get-ItemProperty $uninstallKey).DisplayName) $((Get-ItemProperty $uninstallKey).DisplayVersion)"

          # A frame drawn without opening a window.
          $p = Start-Process $exe -ArgumentList '--screenshot', "$shots\frame.png" -RedirectStandardError "$shots\screenshot.log" -PassThru
          # Holding the handle keeps the exit code readable once it ends.
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'neoamp.exe --screenshot did not finish' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$shots\frame.png")) { throw "neoamp.exe --screenshot failed with code $($p.ExitCode)" }

          # NeoAmp itself, with its log kept, since a windowed program has no console. GitHub's
          # Windows machines have no sound card, so it runs silently.
          $env:RUST_LOG = 'info,neoamp::window_icon=debug'
          $p = Start-Process $exe -RedirectStandardError "$shots\neoamp.log" -PassThru
          $null = $p.Handle
          Start-Sleep -Seconds 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $bitmap.Save("$shots\desktop.png")

          # The icon as Explorer finds it in neoamp.exe (build.rs), and on each of NeoAmp's
          # windows, where the taskbar and Alt+Tab look for it (src/window_icon.rs).
          [System.Drawing.Icon]::ExtractAssociatedIcon($exe).ToBitmap().Save("$shots\exe-icon.png")
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class NeoAmpWindows {
              delegate bool EnumWindowsProc(IntPtr hwnd, IntPtr lParam);
              [DllImport("user32.dll")] static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);
              [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
              [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr hwnd);
              [DllImport("user32.dll")] static extern int GetWindowLong(IntPtr hwnd, int index);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr hwnd, StringBuilder text, int max);
              [DllImport("user32.dll")] static extern IntPtr SendMessage(IntPtr hwnd, uint msg, IntPtr wParam, IntPtr lParam);
              const uint WM_GETICON = 0x7F;
              const int GWL_EXSTYLE = -20, WS_EX_TOOLWINDOW = 0x80;
              // The process's windows that the taskbar can show (visible, top-level, not tool
              // windows such as winit's hidden one): each one's title, and whether it has a
              // large and a small icon.
              public static List<string> Describe(int pid) {
                  var found = new List<string>();
                  EnumWindows((hwnd, lParam) => {
                      uint owner;
                      GetWindowThreadProcessId(hwnd, out owner);
                      if (owner == (uint)pid && IsWindowVisible(hwnd)
                          && (GetWindowLong(hwnd, GWL_EXSTYLE) & WS_EX_TOOLWINDOW) == 0) {
                          var title = new StringBuilder(256);
                          GetWindowText(hwnd, title, title.Capacity);
                          bool large = SendMessage(hwnd, WM_GETICON, (IntPtr)1, IntPtr.Zero) != IntPtr.Zero;
                          bool small = SendMessage(hwnd, WM_GETICON, IntPtr.Zero, IntPtr.Zero) != IntPtr.Zero;
                          found.Add(string.Format("{0}: large icon {1}, small icon {2}", title, large, small));
                      }
                      return true;
                  }, IntPtr.Zero);
                  return found;
              }
          }
          '@
          $windows = @([NeoAmpWindows]::Describe($p.Id))

          # Files opened together, as Explorer opens them: a copy of NeoAmp for each, all at
          # once, which the running one gathers into one playlist in the order of their names.
          function New-Wav([string] $path) {
            # A second of silence: 8000 Hz, 16-bit, mono.
            $data = [byte[]]::new(16000)
            $w = [IO.BinaryWriter]::new([IO.File]::Create($path))
            $w.Write([Text.Encoding]::ASCII.GetBytes('RIFF')); $w.Write([int](36 + $data.Length))
            $w.Write([Text.Encoding]::ASCII.GetBytes('WAVEfmt ')); $w.Write([int]16)
            $w.Write([int16]1); $w.Write([int16]1); $w.Write([int]8000); $w.Write([int]16000)
            $w.Write([int16]2); $w.Write([int16]16)
            $w.Write([Text.Encoding]::ASCII.GetBytes('data')); $w.Write([int]$data.Length); $w.Write($data)
            $w.Close()
          }
          $music = (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'music') -Force).FullName
          $names = '03 Three.wav', '01 One.wav', '02 Two.wav'
          foreach ($name in $names) { New-Wav (Join-Path $music $name) }
          $copies = foreach ($name in $names) { Start-Process $exe -ArgumentList ('"' + (Join-Path $music $name) + '"') -PassThru }
          # Each hands its file over and ends; the playlist is saved within two seconds.
          foreach ($copy in $copies) { $null = $copy.WaitForExit(30000) }
          Start-Sleep -Seconds 4
          $playlistFile = Join-Path $env:APPDATA 'NeoAmp\playlist.m3u8'
          $opened = if (Test-Path $playlistFile) {
            (Get-Content $playlistFile | Where-Object { $_ -and $_ -notmatch '^#' } | ForEach-Object { Split-Path $_ -Leaf }) -join ', '
          }

          $running = -not $p.HasExited
          if ($running) { Stop-Process -Id $p.Id -Force; $p.WaitForExit() }
          Get-Content "$shots\neoamp.log"
          $windows | ForEach-Object { Write-Output "Window $_" }
          if (-not $running) { throw "NeoAmp quit by itself, with code $($p.ExitCode)" }
          if (Select-String -Path "$shots\neoamp.log" -Pattern '^Error:' -Quiet) { throw 'NeoAmp could not start' }
          if ($windows.Count -eq 0) { throw 'NeoAmp showed no windows' }
          if ($windows -match 'False') { throw 'a NeoAmp window has no icon' }
          Write-Output "Files opened together became the playlist: $opened"
          if ($opened -ne '01 One.wav, 02 Two.wav, 03 Three.wav') { throw 'the files opened together are not one playlist, in order' }

          # The extensions NeoAmp opens on a double-click, having found no other program for
          # them: skins among them, since GitHub's machines have no Winamp. Another program then
          # takes skins over, as one installed later would: uninstalling must leave it that,
          # and take NeoAmp off the rest.
          $classes = 'HKCU:\Software\Classes'
          $ours = @((Get-Item 'HKCU:\Software\NeoAmp\Capabilities\FileAssociations').Property | Where-Object {
            (Get-ItemProperty "$classes\$_" -ErrorAction SilentlyContinue).'(default)' -like 'NeoAmp.*'
          })
          Write-Output "NeoAmp opens these on a double-click: $($ours -join ' ')"
          if ($ours -notcontains '.wsz') { throw 'the installer did not make NeoAmp open skins' }
          Set-ItemProperty "$classes\.wsz" -Name '(default)' -Value 'Other.wsz'

          # The uninstaller hands over to a copy of itself and returns at once: wait for that.
          Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          foreach ($path in $app, $uninstallKey, 'HKCU:\Software\Classes\NeoAmp.wsz', 'HKCU:\Software\Classes\NeoAmp.mp3',
                   'HKCU:\Software\NeoAmp', 'HKCU:\Software\Classes\Directory\shell\NeoAmp.play',
                   'HKCU:\Software\Classes\SystemFileAssociations\.mp3\shell\NeoAmp.enqueue') {
            if (Test-Path $path) { throw "the uninstaller left $path" }
          }
          $skinOpener = (Get-ItemProperty "$classes\.wsz" -ErrorAction SilentlyContinue).'(default)'
          if ($skinOpener -ne 'Other.wsz') { throw "the uninstaller took skins from the program that opens them now (left: $skinOpener)" }
          Remove-Item "$classes\.wsz" -Recurse
          foreach ($ext in $ours | Where-Object { $_ -ne '.wsz' }) {
            if ((Get-ItemProperty "$classes\$ext" -ErrorAction SilentlyContinue).'(default)') { throw "the uninstaller left NeoAmp opening $ext files" }
          }
          Write-Output 'Installed, ran and uninstalled NeoAmp'
      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-try
          path: ${{ runner.temp }}/try
          if-no-files-found: ignore
